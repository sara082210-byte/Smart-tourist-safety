spring.application.name=safejourney-backend
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/safejourney}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:jeeva2007}}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Authentication (server-side session in an HttpOnly cookie) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Set SESSION_COOKIE_SAME_SITE=none and SESSION_COOKIE_SECURE=true when frontend & backend are on different domains over HTTPS
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie

# Allowed origin(s), comma separated (e.g. https://your-frontend.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# --- Agentic AI Safety Assistant / Google Gemini ---
# External Gemini API key (never hardcoded, defaults to empty to prevent startup failure if not yet set)
gemini.api.key=${GEMINI_API_KEY:}
llm.api.key=${LLM_API_KEY:${gemini.api.key:}}
llm.api.provider=${LLM_PROVIDER:gemini}
llm.api.model=${LLM_MODEL:gemini-3.5-flash}
llm.api.url=${LLM_API_URL:}